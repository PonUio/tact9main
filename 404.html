<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Страница не найдена</title>

  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #e9e9e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      padding: 20px;
    }

    
    .page {
      max-width: 620px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 2px 6px rgba(0, 0, 0, 0.02);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    
    .logo {
      text-align: center;
      padding: 28px 24px 16px;
      background: #fff;
    }

    .logo img {
      width: 100%;
      max-width: 260px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* контент — отступы как в статьях */
    .content {
      padding: 8px 32px 48px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .content {
        padding: 8px 24px 40px;
      }
      .logo {
        padding: 22px 20px 12px;
      }
    }

    @media (max-width: 450px) {
      .content {
        padding: 6px 20px 36px;
      }
      .logo img {
        max-width: 200px;
      }
    }

   
    .error-number {
      font-size: 110px;
      font-weight: 800;
      line-height: 1;
      color: #1a1a1a;
      letter-spacing: -4px;
      margin: 20px 0 12px;
      background: linear-gradient(135deg, #1e2a3a, #2c3e50);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    @media (max-width: 480px) {
      .error-number {
        font-size: 80px;
        letter-spacing: -2px;
      }
    }

    .title-404 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #2c3e50;
    }

    .divider {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #eee;
      margin: 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #555;
      font-size: 18px;
    }

    .text-404 {
      font-size: 14px;
      line-height: 1.65;
      color: #5a6874;
      max-width: 320px;
      margin: 0 auto 28px;
      text-align: center;
    }

    
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1e2f3c;
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 40px;
      transition: all 0.25s ease;
      font-family: 'Montserrat', sans-serif;
      border: none;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    .home-btn:hover {
      background: #2c4a60;
      transform: translateY(-2px);
      gap: 12px;
    }

    
    .footer-note {
      margin-top: 36px;
      font-size: 11px;
      color: #a0aab5;
      border-top: 1px solid #edf2f7;
      padding-top: 22px;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>

<div class="page">

  
  <div class="logo">
    <img src="logo2.png" alt="tact9_BLOG" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 280 70%22%3E%3Crect width=%22280%22 height=%2270%22 fill=%22%23f8fafc%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23334455%22 font-family=%22Montserrat%22 font-size=%2220%22 font-weight=%22600%22%3Etact9_BLOG%3C/text%3E%3C/svg%3E'">
  </div>

  
  <div class="content">
    <div class="error-number">404</div>
    <div class="title-404">Страница не найдена</div>

    <div class="divider">+</div>

    <div class="text-404">
      Возможно, вы перешли по нерабочей ссылке или страница была удалена.<br>
      Но главное — дизайн остаётся с вами.
    </div>

    <a href="/tact9main/" class="home-btn" id="homeLink">
      ← На главную
    </a>

    <div class="footer-note">
      tact9_BLOG — минимализм и чистота
    </div>
  </div>
</div>


</body>
</html>
